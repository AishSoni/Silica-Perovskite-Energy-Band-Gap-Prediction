# Canonical Materials Project query configuration.
# This file is the single source of truth for the corrected pipeline.

dataset:
  name: double_perovskites
  family: double_perovskite
  description: "General ABC2D6 / A2BB'X6 double perovskites, including oxide and halide families."

chemistry:
  # Broad element pools for candidate retrieval and post-download validation.
  # Validation, not the raw API query alone, decides whether a material is accepted.
  a_site:
    - Li
    - Na
    - K
    - Rb
    - Cs
    - Mg
    - Ca
    - Sr
    - Ba
    - La
    - Y
    - Bi
    - Pb
    - Tl
  b_site:
    - Ag
    - Al
    - Au
    - Bi
    - Cd
    - Co
    - Cr
    - Cu
    - Fe
    - Ga
    - Hf
    - In
    - Ir
    - Mn
    - Mo
    - Nb
    - Ni
    - Os
    - Pb
    - Re
    - Sb
    - Sc
    - Sn
    - Ta
    - Ti
    - V
    - W
    - Zn
    - Zr
  x_site:
    - O
    - F
    - Cl
    - Br
    - I

query:
  # Candidate search is intentionally broad; validation performs strict filtering.
  num_elements:
    min: 3
    max: 5
  num_sites:
    min: 8
    max: 40
  energy_above_hull:
    min: null
    max: 0.2
  band_gap:
    min: 0.0
    max: 10.0
  theoretical: null
  include_deprecated: false
  chunk_size: 1000
  max_results: null

validation:
  accepted_formula_anonymous:
    - ABC2D6
    - A2BC2D6
    - A2B2C6
    - A2BB'C6
    - ABCD6
  require_band_gap: true
  require_structure: true
  require_x_site: true
  require_a_or_b_site: true
  require_not_deprecated: true
  deduplicate_by:
    - material_id
  metal_threshold_eV: 0.1

fields:
  - material_id
  - formula_pretty
  - formula_anonymous
  - elements
  - nelements
  - structure
  - symmetry
  - band_gap
  - is_gap_direct
  - formation_energy_per_atom
  - energy_above_hull
  - density
  - volume
  - nsites
  - theoretical
  - deprecated
  - energy_per_atom
  - is_stable

paths:
  raw_json: data/raw/double_perovskites_raw.json
  raw_csv: data/raw/double_perovskites_raw.csv
  manifest: data/raw/dataset_manifest.json
  validated_csv: data/processed/validated_materials.csv
  features_csv: data/processed/perovskites_features.csv
  validation_dir: results/dataset_validation
  feature_sets_dir: results/feature_sets
  models_dir: models
  figures_dir: figures
  results_dir: results

modeling:
  random_state: 42
  test_size: 0.2
  imputation_strategy: median
  scaler: robust
  apply_smote: true
  feature_subset_sizes:
    - 10
    - 22

notes: |
  Do not treat formula_anonymous alone as proof of perovskite structure.
  The downloader creates candidates; src/validate_dataset.py applies the acceptance rules.
